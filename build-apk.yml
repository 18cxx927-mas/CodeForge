# GitHub Actions workflow to build the CodeForge Android APK.
# Place this file at: .github/workflows/build-apk.yml  in your repository.

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Which APK to build'
        type: choice
        default: debug
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.buildType || 'debug' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The project ships without the gradlew wrapper scripts, so install
      # Gradle and generate the wrapper, then build with it (cacheable).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1

      # The secrets-gradle-plugin expects an app/.env file, and debug builds
      # sign with a debug.keystore at the repo root — create them if missing.
      - name: Create missing config files
        run: |
          [ -f app/.env ] || touch app/.env
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Release builds sign with my-upload-key.jks (alias "upload") decoded
      # from the KEYSTORE_BASE64 repo secret.
      - name: Decode release keystore
        if: env.BUILD_TYPE == 'release'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew "assemble${BUILD_TYPE^}" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-${{ env.BUILD_TYPE }}-apk
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error
